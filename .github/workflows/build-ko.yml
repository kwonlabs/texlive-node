name: Build Korean Image

on:
  schedule:
    - cron: '30 0 * * 0' # 30 mins after base
  workflow_dispatch:
    inputs:
      node-version:
        description: 'Node.js version'
        required: true
        default: '24.13.0'
      texlive-version:
        description: 'TeXLive version (latest or TL2024-historic)'
        required: true
        default: 'latest'

env:
  DOCKER_ORG: makye
  IMAGE_NAME: texlive-node

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      node_version: ${{ steps.set-version.outputs.node_version }}
      texlive_version: ${{ steps.set-version.outputs.texlive_version }}
      should_run: ${{ steps.set-version.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
      - id: set-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "node_version=${{ github.event.inputs.node-version }}" >> $GITHUB_OUTPUT
            echo "texlive_version=${{ github.event.inputs.texlive-version }}" >> $GITHUB_OUTPUT
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
             # Logic for schedule: build latest LTS
             LATEST_LTS=$(curl -s https://nodejs.org/dist/index.json | jq -r '[.[] | select(.lts != false)][0].version' | sed 's/^v//')
             
             TL_VER="latest"
             if [ -f texlive-versions.txt ]; then
                TL_VER=$(cat texlive-versions.txt | grep -v '^#' | head -n 1 || echo "latest")
             fi

             if [ -z "$LATEST_LTS" ]; then
                echo "::error::Could not find latest Node.js LTS"
                exit 1
             fi

             TAG="${TL_VER}-${LATEST_LTS}-ko"
             BASE_TAG="${TL_VER}-${LATEST_LTS}"
             
             # Check if KO missing AND BASE exists
             HTTP_KO=$(curl -s -L -o /dev/null -w "%{http_code}" "https://hub.docker.com/v2/repositories/${{ env.DOCKER_ORG }}/${{ env.IMAGE_NAME }}/tags/$TAG/")
             HTTP_BASE=$(curl -s -L -o /dev/null -w "%{http_code}" "https://hub.docker.com/v2/repositories/${{ env.DOCKER_ORG }}/${{ env.IMAGE_NAME }}/tags/$BASE_TAG/")

             if [ "$HTTP_KO" -ne 200 ] && [ "$HTTP_BASE" -eq 200 ]; then
               echo "node_version=$LATEST_LTS" >> $GITHUB_OUTPUT
               echo "texlive_version=$TL_VER" >> $GITHUB_OUTPUT
               echo "should_run=true" >> $GITHUB_OUTPUT
             else
               echo "should_run=false" >> $GITHUB_OUTPUT
             fi
          fi

  build:
    needs: setup
    if: needs.setup.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push KO
        run: |
          IMAGE_NAME="${{ env.DOCKER_ORG }}/${{ env.IMAGE_NAME }}" ./build-ko.sh ${{ needs.setup.outputs.node_version }} ${{ needs.setup.outputs.texlive_version }} --force
          TAG="${{ needs.setup.outputs.texlive_version || 'latest' }}-${{ needs.setup.outputs.node_version }}-ko"
          docker push ${{ env.DOCKER_ORG }}/${{ env.IMAGE_NAME }}:$TAG
